name: Mobile TypeScript checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the locked dependencies
        run: npm ci
      - name: Check the mobile TypeScript code
        run: npx tsc --noEmit
